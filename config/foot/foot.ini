# Serpantinum — foot defaults.
#
# Foot is the terminal used in VirtualBox (Kitty's GPU backend can crash
# there). A slight background alpha lets the Hyprland glass blur show
# through, exactly like kitty's background_opacity.
#
# foot >= 1.28 replaced the legacy [colors] section with themed sections,
# so the alpha is declared for both themes.

[colors-dark]
alpha = 0.85

[colors-light]
alpha = 0.85
